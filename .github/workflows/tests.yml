name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-smoke
            pytest-args: -m "api and smoke"
          - name: ui-regression
            pytest-args: -m "ui and regression"
          - name: all
            pytest-args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (${{ matrix.name }})
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest ${{ matrix.pytest-args }}

