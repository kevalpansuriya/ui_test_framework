[pytest]
# Pytest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test*
addopts = 
    -v
    --strict-markers
    --tb=short
    --log-level=INFO
    --capture=no
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s - %(levelname)s - %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
markers =
    api: API tests
    ui: UI tests
    smoke: Smoke tests
    regression: Regression tests

